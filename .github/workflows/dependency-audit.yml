name: Dependency Audit (scheduled)

# Phase 8 — Tier 3: a scheduled, whole-tree npm audit, separate from
# dependency-review.yml (which only looks at what a single PR changes).
# This is the mechanism that would have caught the Phase 6 music-metadata/
# zod findings on an ongoing basis rather than only during a point-in-time
# manual audit. Runs weekly, not per-PR/push — the whole-tree audit result
# does not change meaningfully between individual commits, so running it on
# every push would spend Actions minutes without new information.
on:
  schedule:
    - cron: "0 4 * * 1" # Every Monday 04:00 UTC, after CodeQL
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies (deterministic)
        run: npm ci --include=dev

      # Deliberately does not fail the workflow on its own (`|| true`):
      # this is a reporting job, not a merge gate — dependency-review.yml
      # already gates new, PR-introduced vulnerabilities; this job's value
      # is visibility into the whole tree's drift over time, read from the
      # uploaded artifact, not a pass/fail signal on its own.
      - name: Run npm audit (full tree, JSON report)
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-audit-report
          path: audit-report.json
          retention-days: 30
