    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#101114" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E9EAED" media="(prefers-color-scheme: light)" />
    <script>
      // Apply the theme before first paint: the saved choice wins; with none saved, follow the system setting.
      try {
        var t = localStorage.getItem('pinit_theme');
        if (t === 'dark' || (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
      // Palette: Arctic Harbor (chosen 2026-11-19, default). Warm Sand and Navy & Copper are kept:
      // ?palette=warm-sand, ?palette=navy-copper or ?palette=arctic-harbor switches and remembers.
      try {
        var q = new URLSearchParams(location.search).get('palette');
        var known = { 'arctic-harbor': 1, 'warm-sand': 1, 'navy-copper': 1 };
        if (known[q]) localStorage.setItem('pinit_palette', q);
        var saved = localStorage.getItem('pinit_palette');
        document.documentElement.setAttribute('data-palette', known[saved] ? saved : 'arctic-harbor');
      } catch (e) { document.documentElement.setAttribute('data-palette', 'arctic-harbor'); }
      // Finish: the team's navy version by default; ?finish=silver (black and silver) or ?finish=standard switches and remembers.
      try {
        var f = new URLSearchParams(location.search).get('finish');
        if (f === 'silver' || f === 'standard') localStorage.setItem('pinit_finish', f);
        if (localStorage.getItem('pinit_finish') === 'silver') document.documentElement.setAttribute('data-finish', 'silver');
      } catch (e) {}
    </script>

    <script>
      if (location.pathname === '/scan' || location.pathname.indexOf('/scan/') === 0) {
        document.write('<link rel="manifest" href="/scan-manifest.webmanifest">');
        // Keep the browser's install prompt: it can fire before the page's code has started listening.
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          window.__pinitInstallPrompt = event;
          window.dispatchEvent(new Event('pinit-install-ready'));
        });
      }
    </script>
